name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests app scripts
      - name: Unit and hygiene tests (no database, no network)
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_admin_throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CADW_DB_HOST: localhost
      CADW_DB_PORT: "5432"
      CADW_DB_NAME: cambodia_dw
      CADW_DB_USER: cadw
      CADW_DB_PASSWORD: ci_only_password
      CADW_CHIRPS_SAMPLE_MONTHS: '["2023-07"]'
      CADW_DBT_BIN: .venv-dbt/bin/dbt
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m venv .venv-dbt && .venv-dbt/bin/pip install -r requirements-dbt.txt
      - name: Create the least-privilege role and database (tests scripts/setup_database.sql)
        run: |
          sed "s/REPLACE_WITH_A_STRONG_PASSWORD/ci_only_password/" scripts/setup_database.sql             | PGPASSWORD=ci_admin_throwaway psql -h localhost -U postgres -v ON_ERROR_STOP=1
      - name: Run pipeline on a small sample (ingest, Bronze, dbt seed/run/test)
        run: python -m cadw.cli run
        env:
          PYTHONPATH: src
      - name: Independent Gold verification
        run: python scripts/verify_gold.py
      - name: Database and dashboard tests
        run: pytest -q -m db
