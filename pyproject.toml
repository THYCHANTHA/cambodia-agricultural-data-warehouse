[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cambodia-agricultural-data-warehouse"
version = "0.1.0"
description = "Prototype data warehouse integrating FAOSTAT, World Bank, CHIRPS and geoBoundaries data for Cambodian agriculture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thy Chantha" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rasterio>=1.3",
    "prefect>=3.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: needs internet access to a public data source",
    "db: needs a PostgreSQL connection configured through CADW_DB_* variables",
]
addopts = "-m \"not network and not db\""

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
