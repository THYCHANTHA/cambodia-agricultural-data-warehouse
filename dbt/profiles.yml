# Credentials come from the environment (same CADW_DB_* variables as the Python code).
cadw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('CADW_DB_HOST', 'localhost') }}"
      port: "{{ env_var('CADW_DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('CADW_DB_USER', 'cadw') }}"
      password: "{{ env_var('CADW_DB_PASSWORD') }}"
      dbname: "{{ env_var('CADW_DB_NAME', 'cambodia_dw') }}"
      schema: silver
      threads: 4
